# Extraction rules for forcedexposure.com.
#
# Written against the live markup (probed 2026-08-22). Product pages carry a
# flat run of label/value divs inside div.product-right:
#
#   <div class="meta-label">Genre</div><div class="meta-value">ROCK</div>
#
# The labels are unpunctuated, so every pattern is anchored to match the label
# div exactly and the value is read from the following sibling.

[site]
base_url = "https://www.forcedexposure.com"
list_separators = ",/;"
combined_split = '\s+[-–—]\s+'

[listing]
# The sitemap index is the authoritative product enumeration; these curated
# section indexes are what the Craft list has always been compiled from.
seeds = [
  "https://www.forcedexposure.com/New/NewIndex.html",
  "https://www.forcedexposure.com/Best/BestIndex.html",
  "https://www.forcedexposure.com/Forthcoming.html",
]
link_selector = "a[href]"
product_url_pattern = '/Catalog/[^/?#]+/[^/?#]+\.html'
next_page_selector = "a[rel=next]"

# --- product fields ---------------------------------------------------------

[[product.artist]]
type = "label"
label = '^artist\s*:?\s*$'
scope = ".meta-label"

[[product.title]]
type = "label"
label = '^title\s*:?\s*$'
scope = ".meta-label"

[[product.genre]]
type = "label"
label = '^genre\s*:?\s*$'
scope = ".meta-label"

[[product.label]]
type = "label"
label = '^label\s*:?\s*$'
scope = ".meta-label"

[[product.catalog_no]]
type = "label"
label = '^catalog\s*#?\s*:?\s*$'
scope = ".meta-label"

[[product.format]]
type = "label"
label = '^format\s*:?\s*$'
scope = ".meta-label"

# Fallback when the meta block is absent: the <title> is
# "Forced Exposure | ARTIST: Title Format".
[[product.combined]]
type = "css"
selector = "title"
